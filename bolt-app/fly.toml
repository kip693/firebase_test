app = "slack-bolt-app"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"

# Socket Mode はHTTPポートを使わないが、
# Fly.io はヘルスチェック用にポートが必要
[http_service]
  internal_port = 3000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
